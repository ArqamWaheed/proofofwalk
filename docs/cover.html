<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700&family=Instrument+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1000px; height: 420px; overflow: hidden; }
  body {
    position: relative;
    background: #0e1020;
    font-family: "Instrument Sans", system-ui, sans-serif;
    color: #eceaf6;
  }
  .wash {
    position: absolute; inset: 0;
    background:
      radial-gradient(60% 90% at 8% 0%, rgba(255,160,70,.16), transparent 68%),
      radial-gradient(55% 80% at 96% 12%, rgba(111,227,232,.13), transparent 70%);
  }
  .frame { position: relative; height: 100%; padding: 44px 56px; display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .mark { display: flex; align-items: center; gap: 10px;
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500;
    letter-spacing: .18em; text-transform: uppercase; color: #9ea0c0; }
  .mark svg { color: #ffa046; }
  .chip { display: flex; align-items: center; gap: 7px; padding: 6px 13px;
    border: 1px solid #2e3358; border-radius: 999px; background: rgba(111,227,232,.07);
    font-family: "JetBrains Mono", monospace; font-size: 11.5px; letter-spacing: .13em;
    text-transform: uppercase; color: #6fe3e8; }
  .chip i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .mid { flex: 1; display: flex; align-items: center; gap: 48px; }
  .claim { display: flex; flex-direction: column; gap: 16px; }
  .eyebrow { font-family: "JetBrains Mono", monospace; font-size: 12.5px; font-weight: 500;
    letter-spacing: .17em; text-transform: uppercase; color: #8386ac; }
  h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 700;
    font-size: 53px; line-height: 1.04; letter-spacing: -.036em; max-width: 545px; }

  .route { flex: none; width: 232px; height: 232px; border-radius: 16px;
    border: 1px solid #232746; background-color: #171a2e;
    background-image:
      linear-gradient(rgba(46,51,88,.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(46,51,88,.5) 1px, transparent 1px);
    background-size: 26px 26px; background-position: center; }
  .route svg { width: 100%; height: 100%; }
  .route .start { fill: #6fe3e8; }
  .route .end { fill: #ffa046; }
  .route path { fill: none; stroke: #ffa046; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }

  .bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 32px; }
  .sealwrap { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .sealhead { font-family: "JetBrains Mono", monospace; font-size: 10.5px;
    letter-spacing: .16em; text-transform: uppercase; color: #8386ac; }
  .bars { width: 100%; height: 30px; color: #6fe3e8; }
  .bars rect { fill: currentColor; }
  .tag { flex: none; text-align: right; font-family: "JetBrains Mono", monospace;
    font-size: 11.5px; letter-spacing: .09em; color: #9ea0c0; line-height: 1.75; }
</style></head>
<body>
<div class="wash"></div>
<div class="frame">
  <div class="top">
    <div class="mark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <ellipse cx="8.6" cy="8.4" rx="2" ry="2.6"/><ellipse cx="15.4" cy="8.4" rx="2" ry="2.6"/>
        <ellipse cx="4.4" cy="12.6" rx="1.8" ry="2.3"/><ellipse cx="19.6" cy="12.6" rx="1.8" ry="2.3"/>
        <path d="M12 12.4c3.2 0 5.5 2.5 5.5 4.9 0 2-1.7 3.1-3.5 2.6a7.4 7.4 0 0 0-4 0c-1.8.5-3.5-.6-3.5-2.6 0-2.4 2.3-4.9 5.5-4.9Z"/>
      </svg>
      Proof of Walk
    </div>
    <div class="chip"><i></i> Solana devnet</div>
  </div>

  <div class="mid">
    <div class="claim"><p class="eyebrow">Your dog walker says they went.</p><h1>This makes the walk say so too.</h1></div>
    <div class="route">
      <svg viewBox="0 0 100 100">
        <path d="M20 80C22 62 38 64 42 50c4-14-4-24 8-30s28 2 28 16-14 18-12 30c2 12 14 12 16 6"/>
        <circle class="start" cx="20" cy="80" r="4"/>
        <circle class="end" cx="82" cy="72" r="4"/>
      </svg>
    </div>
  </div>

  <div class="bottom">
    <div class="sealwrap">
      <div class="sealhead">the walk, sealed</div>
      <svg class="bars" viewBox="0 0 127 32" preserveAspectRatio="none"><rect x="0" y="21.29" width="3" height="10.71"/><rect x="4" y="14.94" width="3" height="17.06"/><rect x="8" y="7.18" width="3" height="24.82"/><rect x="12" y="6.35" width="3" height="25.65"/><rect x="16" y="16.59" width="3" height="15.41"/><rect x="20" y="8.59" width="3" height="23.41"/><rect x="24" y="15.88" width="3" height="16.12"/><rect x="28" y="19.18" width="3" height="12.82"/><rect x="32" y="6.82" width="3" height="25.18"/><rect x="36" y="5.18" width="3" height="26.82"/><rect x="40" y="27.88" width="3" height="4.12"/><rect x="44" y="2.71" width="3" height="29.29"/><rect x="48" y="11.88" width="3" height="20.12"/><rect x="52" y="20.59" width="3" height="11.41"/><rect x="56" y="6.00" width="3" height="26.00"/><rect x="60" y="10.47" width="3" height="21.53"/><rect x="64" y="13.88" width="3" height="18.12"/><rect x="68" y="4.71" width="3" height="27.29"/><rect x="72" y="10.59" width="3" height="21.41"/><rect x="76" y="15.53" width="3" height="16.47"/><rect x="80" y="19.76" width="3" height="12.24"/><rect x="84" y="6.82" width="3" height="25.18"/><rect x="88" y="23.76" width="3" height="8.24"/><rect x="92" y="3.88" width="3" height="28.12"/><rect x="96" y="7.18" width="3" height="24.82"/><rect x="100" y="2.47" width="3" height="29.53"/><rect x="104" y="16.94" width="3" height="15.06"/><rect x="108" y="28.12" width="3" height="3.88"/><rect x="112" y="24.00" width="3" height="8.00"/><rect x="116" y="10.00" width="3" height="22.00"/><rect x="120" y="19.41" width="3" height="12.59"/><rect x="124" y="13.53" width="3" height="18.47"/></svg>
    </div>
    <div class="tag">GPS stays on the phone<br>only the hash goes on chain</div>
  </div>
</div>
</body></html>
